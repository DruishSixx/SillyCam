<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Silly Cam">
<meta name="theme-color" content="#2B1640">
<title>Silly Cam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --grape: #2B1640;
    --grape-2: #3D2159;
    --grape-3: #563080;
    --sun: #FFD23F;
    --gum: #FF5C8A;
    --sky: #6EC6FF;
    --cream: #FFF6E0;
    --muted: #CBB8E3;
    --lav: #5B3A82;
    --lav-2: #7A56A8;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--grape);
    color: var(--cream);
    font-family: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px 4px;
  }
  .logo { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1; transform: rotate(-3deg); }
  .logo span { display: inline-block; }
  .logo span:nth-child(odd) { transform: translateY(-2px); }
  .gallery-btn {
    background: var(--grape-2); border: 2px solid var(--grape-3); border-radius: 999px;
    padding: 4px 14px 2px; font-weight: 700; font-size: 1rem;
  }
  .gallery-btn b { color: var(--sun); }

  .stage {
    flex: 1; min-height: 0; position: relative;
    margin: 4px 12px; border-radius: 28px; overflow: hidden;
    background: #000;
    touch-action: none;
  }
  #out { width: 100%; height: 100%; object-fit: contain; display: block; }
  .stage-msg {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 12px;
    padding: 24px; background: var(--grape-2); font-size: 1.15rem; line-height: 1.35;
  }
  .stage-msg[hidden] { display: none; }
  .big-btn {
    background: var(--sun); color: var(--grape); border: 0; border-radius: 999px;
    padding: 10px 26px 7px; font-weight: 800; font-size: 1.25rem;
  }
  .rec-bar {
    position: absolute; top: 12px; left: 16px; right: 16px; height: 18px;
    background: rgba(43,22,64,.7); border: 3px solid var(--cream); border-radius: 999px; overflow: hidden;
  }
  .rec-bar[hidden] { display: none; }
  .rec-fill { height: 100%; width: 0; background: var(--sun); border-radius: 999px; }
  .rec-bar.ending .rec-fill { background: var(--gum); }

  .processing {
    position: fixed; inset: 0; z-index: 35; background: var(--grape);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  }
  .processing[hidden] { display: none; }
  .proc-icon { font-size: 5rem; line-height: 1; animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .proc-dots { display: flex; gap: 12px; }
  .proc-dots span { width: 18px; height: 18px; border-radius: 50%; background: var(--sun); animation: hop .9s ease-in-out infinite; }
  .proc-dots span:nth-child(2) { animation-delay: .15s; background: var(--gum); }
  .proc-dots span:nth-child(3) { animation-delay: .3s; background: var(--sky); }
  @keyframes hop { 50% { transform: translateY(-16px); } }
  .proc-text { font-size: 1.5rem; font-weight: 800; }
  .hint {
    position: absolute; top: 42px; left: 50%; transform: translateX(-50%);
    background: rgba(43,22,64,.75); border-radius: 999px; padding: 2px 12px 0;
    font-size: .9rem; color: var(--cream); white-space: nowrap; pointer-events: none;
  }
  .hint[hidden] { display: none; }

  .controls { padding: 6px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .row::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 2px solid var(--grape-3); background: var(--grape-2);
    border-radius: 16px; padding: 4px 12px 2px; font-weight: 700; font-size: 1rem;
    display: flex; align-items: center; gap: 6px;
  }
  .chip[aria-pressed="true"] { background: var(--sky); border-color: var(--sky); color: var(--grape); }
  #modeRow .chip { font-size: 1.08rem; padding: 6px 14px 4px; }
  .row.sub .chip { background: var(--lav); border-color: var(--lav-2); }
  .row.sub .chip[aria-pressed="true"] { background: var(--sky); border-color: var(--sky); color: var(--grape); }
  .chip .em { font-size: 1.2rem; }
  .size-row { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--muted); }
  .size-row[hidden] { display: none; }
  input[type=range] { flex: 1; accent-color: var(--sun); }

  /* ---- bottom bar ---- */
  .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px 12px 10px; position: relative; z-index: 16; background: var(--grape); }
  .handle-btn {
    justify-self: start; margin-left: 22px; width: 58px; height: 58px; border-radius: 18px;
    border: 3px solid rgba(255,255,255,.85); font-size: 1.8rem; line-height: 1; color: #fff;
    display: flex; align-items: center; justify-content: center; position: relative; padding: 0;
  }
  .handle-btn .up { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: .9rem; color: var(--cream); animation: bob 1.1s ease-in-out infinite; }
  .handle-btn.open .up { display: none; }
  @keyframes bob { 50% { transform: translate(-50%, -5px); } }
  .pills { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
  .pill { pointer-events: auto; border: 2px solid rgba(255,255,255,.85); background: rgba(43,22,64,.85); color: var(--cream); border-radius: 999px; padding: 3px 10px 1px; font-weight: 700; font-size: .9rem; display: flex; align-items: center; gap: 4px; }
  .pill .x { font-size: .75rem; opacity: .85; }

  /* ---- drawer ---- */
  .drawer {
    position: fixed; left: 8px; right: 8px; z-index: 15;
    bottom: calc(92px + env(safe-area-inset-bottom, 0px));
    max-height: 54vh; display: flex; flex-direction: column;
    background: #1E0F2E; border-radius: 22px; padding: 6px 8px 8px;
    box-shadow: 0 -8px 30px rgba(0,0,0,.45);
    transform: translateY(calc(100% + 140px)); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  }
  .drawer.open { transform: none; }
  .grabzone { padding: 4px 0 8px; touch-action: none; cursor: grab; flex: none; }
  .grab { width: 56px; height: 6px; border-radius: 3px; background: #7A56A8; margin: 0 auto; }
  .catbox { background: #120820; border-radius: 16px; padding: 8px; flex: none; }
  .cat-lbl { font-size: .8rem; color: var(--muted); font-weight: 700; margin: 0 0 4px 4px; }
  .cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .cat { border: 0; border-radius: 14px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: .85rem; line-height: 1.1; color: #fff; position: relative; padding: 0; }
  .cat .em { font-size: 1.45rem; line-height: 1.1; }
  .cat[aria-selected="true"] { outline: 4px solid #fff; outline-offset: -4px; }
  .cat .dot { position: absolute; top: 5px; right: 6px; width: 11px; height: 11px; border-radius: 50%; background: var(--sun); border: 2px solid #fff; display: none; }
  .cat.active .dot { display: block; }
  .divider { height: 2px; background: #3D2159; margin: 8px 2px; border-radius: 1px; }
  .panel { margin-top: 8px; border-radius: 16px; padding: 10px; overflow-y: auto; flex: 1; min-height: 0; -webkit-overflow-scrolling: touch; }
  .sec-title { font-weight: 800; font-size: .95rem; margin: 2px 4px 6px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .tile { border: 0; border-radius: 14px; height: 78px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 700; font-size: .8rem; line-height: 1.05; position: relative; padding: 4px; text-align: center; }
  .tile .em { font-size: 1.9rem; line-height: 1; }
  .tile[aria-pressed="true"] { outline: 4px solid #fff; outline-offset: -4px; background: #fff !important; }
  .tile[aria-pressed="true"]::after { content: "✓"; position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-size: .85rem; }
  .panel .size-row { display: flex; align-items: center; gap: 10px; font-weight: 800; margin: 0 4px 6px; }

  .rec-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-top: 2px; }
  .timer-btn {
    justify-self: end; margin-right: 22px; width: 54px; height: 54px; border-radius: 50%;
    border: 4px solid var(--sky); background: var(--grape-2); position: relative;
    font-size: 1.5rem; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .timer-btn[aria-pressed="true"] { background: var(--sky); }
  .timer-btn b {
    position: absolute; top: -8px; right: -8px; background: var(--gum); color: #fff;
    border-radius: 999px; font-size: .85rem; padding: 2px 7px 0; display: none;
  }
  .timer-btn[aria-pressed="true"] b { display: block; }
  .rec.counting { background: var(--sky); animation: pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(.9); } }
  .countdown {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; font-weight: 800; font-size: 9rem; color: var(--cream);
    text-shadow: 0 6px 0 var(--grape), 0 0 30px rgba(0,0,0,.5);
  }
  .countdown[hidden] { display: none; }
  .countdown span { display: inline-block; }
  .countdown span.pop { animation: popnum .9s ease-out both; }
  .countdown span.go { color: #4CD964; }
  @keyframes popnum { 0% { transform: scale(.3); opacity: 0; } 20% { transform: scale(1.15); opacity: 1; } 40% { transform: scale(1); } 100% { transform: scale(.9); opacity: .85; } }
  .rec {
    width: 76px; height: 76px; border-radius: 50%; border: 6px solid var(--cream);
    background: var(--sun); transition: border-radius .25s, transform .15s, background .2s;
  }
  .rec:active { transform: scale(.92); }
  .rec.on { background: var(--gum); border-radius: 30%; animation: wobble 1.2s ease-in-out infinite; }
  @keyframes wobble { 50% { border-radius: 42% 30% 38% 28%; transform: rotate(6deg); } }

  /* Sheets */
  .sheet {
    position: fixed; inset: 0; z-index: 20; background: var(--grape);
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sheet[hidden] { display: none; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; }
  .sheet-head h2 { margin: 0; font-size: 1.6rem; font-weight: 800; }
  .close {
    background: var(--grape-2); border: 2px solid var(--grape-3); border-radius: 999px;
    padding: 2px 16px 0; font-weight: 700;
  }
  .grid {
    flex: 1; overflow-y: auto; padding: 4px 16px 16px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; align-content: start;
  }
  .clip {
    border: 0; padding: 0; background: var(--grape-2); border-radius: 18px; overflow: hidden;
    aspect-ratio: 3 / 4; position: relative;
  }
  .clip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .clip .len {
    position: absolute; bottom: 6px; right: 8px; background: rgba(43,22,64,.8);
    border-radius: 999px; padding: 0 8px; font-weight: 700; font-size: .85rem;
  }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 1.15rem; padding: 40px 12px; }

  .player-wrap { flex: 1; min-height: 0; margin: 0 12px; border-radius: 28px; overflow: hidden; background: #000; position: relative; }
  #player, #fplayer { width: 100%; height: 100%; object-fit: contain; display: block; }
  #player[hidden], #fplayer[hidden], .del[hidden] { display: none; }

  .dialog { position: fixed; inset: 0; z-index: 40; background: rgba(20,8,32,.75); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .dialog[hidden] { display: none; }
  .dbox { background: var(--grape-2); border: 3px solid var(--grape-3); border-radius: 28px; padding: 20px; width: min(360px, 100%); text-align: center; }
  .dicon { font-size: 3rem; line-height: 1.1; }
  .dtext { font-size: 1.5rem; font-weight: 800; margin: 6px 0 16px; }
  .dbtns { display: flex; gap: 12px; }
  .dbtn { flex: 1; border: 0; border-radius: 20px; padding: 14px 8px 10px; font-weight: 800; font-size: 1.3rem; position: relative; overflow: hidden; }
  .dbtn.yes { background: var(--gum); color: #fff; }
  .dbtn.keep { background: var(--cream); color: var(--grape); }
  .dbtn.save { background: #6B5A80; color: rgba(255,246,224,.55); }
  .dbtn.save .fill { position: absolute; inset: 0; width: 0; background: #4CD964; transition: width 3s linear; }
  .dbtn.save.filling .fill { width: 100%; }
  .dbtn.save .lbl { position: relative; }
  .dbtn.save.ready { background: #4CD964; color: #0E3B18; }
  .tap-play {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 4rem; background: transparent; border: 0; color: rgba(255,246,224,.9);
  }
  .speeds { display: flex; gap: 8px; justify-content: center; padding: 12px 12px 4px; flex-wrap: wrap; }
  .speed { min-width: 58px; justify-content: center; }
  .player-foot { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 12px; gap: 8px; }
  .toggle { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .toggle input { width: 22px; height: 22px; accent-color: var(--sun); }
  .del { background: transparent; border: 2px solid var(--gum); color: var(--gum); border-radius: 999px; padding: 2px 14px 0; font-weight: 700; }

  .toast {
    position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--sun); color: var(--grape); font-weight: 800; border-radius: 999px; padding: 6px 18px 3px;
    z-index: 30; transition: opacity .3s; opacity: 0; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .rec.on { animation: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo" aria-label="Silly Cam"><span>S</span><span>i</span><span>l</span><span>l</span><span>y</span> <span>C</span><span>a</span><span>m</span></div>
    <button class="gallery-btn" id="galleryBtn">My videos <b id="count">0</b></button>
  </header>

  <div class="stage" id="stage">
    <canvas id="out"></canvas>
    <div class="countdown" id="countdown" hidden><span id="cdNum">5</span></div>
    <div class="rec-bar" id="recBar" hidden><div class="rec-fill" id="recFill"></div></div>
    <div class="hint" id="hint" hidden>Drag to move your face</div>
    <div class="pills" id="pills"></div>
    <div class="stage-msg" id="startMsg">
      <div style="font-size:3rem">🎃</div>
      <div>Make silly faces and silly videos.<br>Everything stays on this phone.</div>
      <button class="big-btn" id="startBtn">Turn on camera</button>
    </div>
  </div>

  <div class="bar" id="bar">
    <button class="timer-btn" id="timerBtn" aria-pressed="false" aria-label="5 second timer">⏱️<b>5</b></button>
    <button class="rec" id="recBtn" aria-label="Start recording"></button>
    <button class="handle-btn" id="handleBtn" aria-label="Open filters"><span class="up">▲</span><span id="handleEm">🎨</span></button>
  </div>

  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="grabzone" id="grabzone"><div class="grab"></div></div>
    <div class="catbox">
      <p class="cat-lbl">Looks</p>
      <div class="cats" id="looks"></div>
      <div class="divider"></div>
      <p class="cat-lbl">Extras</p>
      <div class="cats" id="extras"></div>
    </div>
    <div class="panel" id="panel"></div>
  </div>
  <input type="file" id="photoInput" accept="image/*" hidden>

  <!-- Gallery -->
  <div class="sheet" id="gallery" hidden>
    <div class="sheet-head">
      <h2>My videos</h2>
      <button class="close" id="galleryClose">Back</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- Player -->
  <div class="sheet" id="playerSheet" hidden>
    <div class="sheet-head">
      <h2>Watch</h2>
      <button class="close" id="playerClose">Back</button>
    </div>
    <div class="player-wrap">
      <video id="player" playsinline webkit-playsinline disablepictureinpicture controlslist="nodownload noremoteplayback" loop></video>
      <canvas id="fplayer" hidden></canvas>
      <button class="tap-play" id="tapPlay" aria-label="Play">▶</button>
    </div>
    <div class="speeds" id="dirs" role="group" aria-label="Direction">
      <button class="chip" data-dir="fwd" aria-pressed="true">▶️ Forward</button>
      <button class="chip" data-dir="rev" aria-pressed="false">⏪ Backward</button>
      <button class="chip" data-dir="boom" aria-pressed="false">🔁 Boomerang</button>
    </div>
    <div class="speeds" id="speeds" role="group" aria-label="Speed" style="padding-top:4px">
      <button class="chip speed" data-rate="0.25" aria-pressed="false">🐌 ¼×</button>
      <button class="chip speed" data-rate="0.5" aria-pressed="false">🐢 ½×</button>
      <button class="chip speed" data-rate="1" aria-pressed="true">1×</button>
      <button class="chip speed" data-rate="2" aria-pressed="false">🐇 2×</button>
      <button class="chip speed" data-rate="3" aria-pressed="false">🚀 3×</button>
    </div>
    <div class="player-foot">
      <label class="toggle"><input type="checkbox" id="sillyVoice" checked> Silly voice</label>
      <button class="del" id="delBtn">Delete</button>
    </div>
  </div>

  <div class="dialog" id="dialog" hidden>
    <div class="dbox" role="dialog" aria-modal="true" aria-labelledby="dText">
      <div class="dicon" id="dIcon">🗑️</div>
      <div class="dtext" id="dText">Delete this video?</div>
      <div class="dbtns" id="dBtns"></div>
    </div>
  </div>

  <div class="processing" id="processing" hidden aria-live="polite">
    <div class="proc-icon">🎬</div>
    <div class="proc-dots"><span></span><span></span><span></span></div>
    <div class="proc-text">Making your video…</div>
  </div>

  <div class="toast" id="toast"></div>

  <video id="cam" playsinline webkit-playsinline muted autoplay style="display:none"></video>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs";

const $ = (id) => document.getElementById(id);
const cam = $("cam"), out = $("out"), octx = out.getContext("2d");
const src = document.createElement("canvas"), sctx = src.getContext("2d");
const bgCanvas = document.createElement("canvas"), bctx = bgCanvas.getContext("2d");
const feat = document.createElement("canvas"), fctx = feat.getContext("2d");

const state = {
  look: "mask", cat: "mask", drawer: false, bg: "pumpkin", photo: null,
  hat: "tophat", glasses: "sun", mask: "monster", mouthFx: "none", env: "none", toon: "rock", overlay: "none", timer: false, counting: false, starting: false, toonHead: "kid", emit: null, dt: 1, lastLoop: 0,
  size: 1, offX: 0, offY: 0,
  landmarker: null, stream: null, lastVideoTime: -1,
  face: null, lastSeen: 0,
  recorder: null, chunks: [], recStart: 0,
};

// ---------- Face landmark indices (MediaPipe Face Mesh) ----------
const LEFT_EYE  = [33, 7, 163, 144, 145, 153, 154, 155, 133, 173, 157, 158, 159, 160, 161, 246];
const RIGHT_EYE = [263, 249, 390, 373, 374, 380, 381, 382, 362, 398, 384, 385, 386, 387, 388, 466];
const MOUTH     = [61, 146, 91, 181, 84, 17, 314, 405, 321, 375, 291, 409, 270, 269, 267, 0, 37, 39, 40, 185];

function boxOf(pts, idx, W, H) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const i of idx) {
    const x = (1 - pts[i].x) * W, y = pts[i].y * H; // mirrored for selfie view
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  return { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, w: maxX - minX, h: maxY - minY };
}

function lerp(a, b, t) { return a + (b - a) * t; }

function pt(pts, i, W, H) { return { x: (1 - pts[i].x) * W, y: pts[i].y * H }; }
function smoothInto(a, b, t) {
  for (const k in b) {
    if (typeof b[k] === "number") a[k] = lerp(a[k], b[k], t);
    else smoothInto(a[k], b[k], t);

function faceFrame(f) {
  const c = Math.cos(f.roll), s = Math.sin(f.roll);
  const mid = { x: (f.eL.cx + f.eR.cx) / 2, y: (f.eL.cy + f.eR.cy) / 2 };
  const toLocal = (p) => { const dx = p.x - mid.x, dy = p.y - mid.y; return { x: dx * c + dy * s, y: -dx * s + dy * c }; };
  const rot = (dx, dy) => ({ x: dx * c - dy * s, y: dx * s + dy * c });
  const toScreen = (lx, ly) => { const r = rot(lx, ly); return { x: mid.x + r.x, y: mid.y + r.y }; };
  return { mid, toLocal, rot, toScreen };
}

// ---------- Floppy physics (ears, tongue) ----------
// A little chain of points: the first one is pinned, the rest swing with gravity.
function chainStep(ch, n, ax, ay, dirx, diry, seg, grav, stiff, damp, dt) {
  if (!ch.p || ch.p.length !== n || Math.hypot(ch.p[0].x - ax, ch.p[0].y - ay) > seg * n * 2) {
    ch.p = [];
    for (let i = 0; i < n; i++) { const x = ax + dirx * seg * i, y = ay + diry * seg * i; ch.p.push({ x, y, px: x, py: y }); }
  }
  const P = ch.p;
  P[0].x = P[0].px = ax; P[0].y = P[0].py = ay;
  for (let i = 1; i < n; i++) {
    const q = P[i];
    const vx = (q.x - q.px) * damp, vy = (q.y - q.py) * damp;
    q.px = q.x; q.py = q.y;
    q.x += vx; q.y += vy + grav * dt;
    q.x += (P[i - 1].x + dirx * seg - q.x) * stiff * dt;
    q.y += (P[i - 1].y + diry * seg - q.y) * stiff * dt;
  }
  for (let it = 0; it < 4; it++) {
    for (let i = 1; i < n; i++) {
      const a = P[i - 1], b = P[i];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, k = (d - seg) / d;
      if (i === 1) { b.x -= dx * k; b.y -= dy * k; }
      else { a.x += dx * k * 0.5; a.y += dy * k * 0.5; b.x -= dx * k * 0.5; b.y -= dy * k * 0.5; }
    }
  }
  return P;
}

  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(P[0].x, P[0].y);
  for (let i = 1; i < P.length - 1; i++) { const mx = (P[i].x + P[i + 1].x) / 2, my = (P[i].y + P[i + 1].y) / 2; ctx.quadraticCurveTo(P[i].x, P[i].y, mx, my); }

}

// Face measurements in "face width = 1" units, so any head can be drawn at any size
function headParams(f) {
  if (!f) return { u: 0.45, mouth: { x: 0, y: 0.52 }, chin: { x: 0, y: 0.85 }, nose: { x: 0, y: 0.28 }, open: 0, eyeL: 1, eyeR: 1 };

  const sc = (p) => { const l = fr.toLocal(p); return { x: l.x / w, y: l.y / w }; };
  return {
    u: f.unit / w, mouth: sc({ x: f.m.cx, y: f.m.cy }), chin: sc(f.chin), nose: sc(f.nose),
    open: clamp((f.mouthOpen - 0.05) / 0.4, 0, 1),
    eyeL: clamp((f.eyeOpenL - 0.11) / 0.15, 0, 1),
    eyeR: clamp((f.eyeOpenR - 0.11) / 0.15, 0, 1),

}
function drawHead(name, hp, place, now) {
  const W0 = place.size, c = Math.cos(place.roll), s = Math.sin(place.roll);
  const scl = (p) => ({ x: p.x * W0, y: p.y * W0 });
  const L = { w: W0, u: hp.u * W0, t: now / 1000, mouth: scl(hp.mouth), chin: scl(hp.chin), nose: scl(hp.nose), open: hp.open, eyeL: hp.eyeL, eyeR: hp.eyeR };
  const rot = (dx, dy) => ({ x: dx * c - dy * s, y: dx * s + dy * c });
  const toScreen = (lx, ly) => { const r = rot(lx, ly); return { x: place.mid.x + r.x, y: place.mid.y + r.y }; };
  if (name === "knight") drawPlume({ L, rot, toScreen });
  octx.save();
  octx.translate(place.mid.x, place.mid.y); octx.rotate(place.roll);
  MASKS[name](octx, L);
  octx.restore();
  if (name === "dog") drawDogEars({ L, rot, toScreen });
  if (place.live) { const m = toScreen(L.mouth.x, L.mouth.y); state.emit = { x: m.x, y: m.y, roll: place.roll, u: L.u, open: hp.open }; }
}

function renderMask(now) {
  const f = state.face;
  if (!f || now - state.lastSeen > 600) return;
  const fr = faceFrame(f);
  drawHead(state.mask, headParams(f), { mid: fr.mid, roll: f.roll, size: f.faceW, live: now - state.lastSeen < 300 }, now);

// ---------- Mouth effects ----------

      hg.addColorStop(0, "#5BB8FF"); hg.addColorStop(1, "#2483D6");
      ctx.fillStyle = "#1C1C22";
      for (const sx of [-1, 1]) rrect(ctx, cx + sx * cw * 0.4 - 0.14 * b, hb - 0.05 * b, 0.28 * b, H - hb + 0.1 * b, 0.06 * b), ctx.fill();
      ctx.fillStyle = hg; rrect(ctx, cx - cw * 0.5, dashY - 0.02 * b, cw, hb - dashY, 0.12 * b); ctx.fill();
      ctx.fillStyle = "#FFF3B0";
      for (const sx of [-1, 1]) ell(ctx, cx + sx * cw * 0.33, dashY + (hb - dashY) * 0.45, 0.13 * b, 0.08 * b);
      ctx.fillStyle = "#1A2230"; rrect(ctx, cx - 0.35 * b, dashY + (hb - dashY) * 0.35, 0.7 * b, (hb - dashY) * 0.3, 0.05 * b); ctx.fill();
      ctx.fillStyle = "#C9D3DE"; rrect(ctx, cx - cw * 0.5, hb - 0.06 * b, cw, 0.08 * b, 0.04 * b); ctx.fill();
    },
  },
};

function renderToon(W, H, now) {
  const t = now / 1000, sc = SCENES[state.toon];
  const lay = sc.back(octx, W, H, t);
  const f = state.face, live = !!f && now - state.lastSeen < 600;
  let ox = 0, oy = 0, roll = 0;
  if (live) {
    const fr = faceFrame(f);
    ox = clamp((fr.mid.x - W / 2) / W, -0.3, 0.3) * lay.size * lay.move;
    oy = clamp((fr.mid.y - H * 0.45) / H, -0.3, 0.3) * lay.size * lay.move * 0.6;
    roll = clamp(f.roll, -0.6, 0.6);
  }
  lay.hx = lay.x + ox; lay.hy = lay.y + oy;
  drawHead(state.toonHead, headParams(live ? f : null), { mid: { x: lay.hx, y: lay.hy }, roll, size: lay.size, live: live && now - state.lastSeen < 300 }, now);
  if (sc.front) sc.front(octx, W, H, t, lay);
}

// Googly eyes: pupils have their own little physics, so they lag and bounce
const googly = [null, null];
let gT = 0;
function drawGoogly(f, now) {
  const dt = gT ? clamp((now - gT) / 16.67, 0.2, 3) : 1;
  gT = now;
  const u = f.unit, R = 0.36 * u, r = 0.17 * u, lim = R - r - 0.02 * u;
  [f.eL, f.eR].forEach((e, i) => {
    let g = googly[i];
    if (!g || Math.hypot(g.x - e.cx, g.y - e.cy) > R * 3) g = googly[i] = { x: e.cx, y: e.cy + lim, vx: 0, vy: 0 };
    g.vy += 0.012 * u * dt;
    const damp = Math.pow(0.97, dt);
    g.vx *= damp; g.vy *= damp;
    g.x += g.vx * dt; g.y += g.vy * dt;
    const dx = g.x - e.cx, dy = g.y - e.cy, d = Math.hypot(dx, dy);
    if (d > lim) {
      const nx = dx / d, ny = dy / d;
      g.x = e.cx + nx * lim; g.y = e.cy + ny * lim;
      const vn = g.vx * nx + g.vy * ny;
      if (vn > 0) { g.vx -= 1.65 * vn * nx; g.vy -= 1.65 * vn * ny; }
    }
    octx.beginPath(); octx.arc(e.cx, e.cy, R, 0, Math.PI * 2);
    octx.fillStyle = "#FFFFFF"; octx.fill();
    octx.strokeStyle = "#1A1210"; octx.lineWidth = 0.05 * u; octx.stroke();
    octx.beginPath(); octx.arc(g.x, g.y, r, 0, Math.PI * 2);
    octx.fillStyle = "#111"; octx.fill();
    octx.beginPath(); octx.arc(g.x - r * 0.35, g.y - r * 0.35, r * 0.25, 0, Math.PI * 2);
    octx.fillStyle = "rgba(255,255,255,.8)"; octx.fill();
    octx.beginPath(); octx.arc(e.cx - R * 0.45, e.cy - R * 0.45, R * 0.18, 0, Math.PI * 2);
    octx.fillStyle = "rgba(255,255,255,.9)"; octx.fill();
  });
}

function drawBeard(ctx, w, mouth, chin, lip, mh, open) {
  const top = 0.12 * w, tipY = chin.y + 0.65 * w;
  const g = ctx.createLinearGradient(0, top, 0, tipY);
  g.addColorStop(0, "#FFFFFF"); g.addColorStop(1, "#D9DDE3");
  ctx.fillStyle = g; ctx.beginPath();
  ctx.moveTo(-0.52 * w, top);
  ctx.quadraticCurveTo(-0.6 * w, chin.y + 0.2 * w, -0.25 * w, chin.y + 0.45 * w);
  ctx.quadraticCurveTo(-0.08 * w, tipY - 0.05 * w, 0, tipY);
  ctx.quadraticCurveTo(0.08 * w, tipY - 0.05 * w, 0.25 * w, chin.y + 0.45 * w);
  ctx.quadraticCurveTo(0.6 * w, chin.y + 0.2 * w, 0.52 * w, top);
  ctx.quadraticCurveTo(0.42 * w, mouth.y, 0.2 * w, mouth.y + 0.08 * w);
  ctx.lineTo(-0.2 * w, mouth.y + 0.08 * w);
  ctx.quadraticCurveTo(-0.42 * w, mouth.y, -0.52 * w, top);
  ctx.closePath();
  ctx.ellipse(mouth.x, mouth.y, 0.17 * w, Math.max(0.05 * w, mh * 0.7 + open * 0.05 * w), 0, 0, Math.PI * 2);
  ctx.fill("evenodd");
  ctx.strokeStyle = "rgba(160,165,175,.6)"; ctx.lineWidth = 0.012 * w;
  for (let i = -3; i <= 3; i++) {
    ctx.beginPath(); ctx.moveTo(i * 0.09 * w, chin.y + 0.05 * w);
    ctx.quadraticCurveTo(i * 0.07 * w, chin.y + 0.35 * w, i * 0.03 * w, chin.y + 0.5 * w); ctx.stroke();
  }
  ctx.fillStyle = "#F2F2F2";
  for (const sx of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(mouth.x, lip.y - 0.02 * w);
    ctx.quadraticCurveTo(mouth.x + sx * 0.18 * w, lip.y - 0.1 * w, mouth.x + sx * 0.32 * w, lip.y + 0.06 * w);
    ctx.quadraticCurveTo(mouth.x + sx * 0.18 * w, lip.y + 0.02 * w, mouth.x, lip.y + 0.03 * w);
    ctx.closePath(); ctx.fill();
  }
}

function spawnSpark(x, y, u, vx, vy, g, max) {
  const cols = ["#FFE066", "#FFFFFF", "#FF9AD5", "#9BE7FF", "#C9A7FF"];
  parts.push({ k: "spark", x, y, vx, vy, g, life: 0, max: max || 60 + Math.random() * 40, s: (0.05 + Math.random() * 0.06) * u, c: cols[Math.floor(Math.random() * cols.length)], ph: Math.random() * 6, u });
}

function renderAccessories(now) {
  const f = state.face;
  if (!f || now - state.lastSeen > 600) return;
  if (state.glasses === "googly") drawGoogly(f, now);
  const c = Math.cos(f.roll), s = Math.sin(f.roll);
  const mid = { x: (f.eL.cx + f.eR.cx) / 2, y: (f.eL.cy + f.eR.cy) / 2 };
  const toLocal = (p) => { const dx = p.x - mid.x, dy = p.y - mid.y; return { x: dx * c + dy * s, y: -dx * s + dy * c }; };
  octx.save();
  octx.translate(mid.x, mid.y); octx.rotate(f.roll);
  if (state.glasses !== "none" && state.glasses !== "googly") { octx.save(); GLASSES[state.glasses](octx, f.unit, toLocal(f.nose), toLocal(f.lip), now / 1000); octx.restore(); }
  if (state.hat === "wizard") { octx.save(); drawBeard(octx, f.faceW, toLocal({ x: f.m.cx, y: f.m.cy }), toLocal(f.chin), toLocal(f.lip), f.m.h, clamp((f.mouthOpen - 0.05) / 0.4, 0, 1)); octx.restore(); }
  if (state.hat !== "none" && state.hat !== "bunny") { const fo = toLocal(f.fore); octx.save(); octx.translate(fo.x, fo.y); HATS[state.hat](octx, f.faceW); octx.restore(); }
  octx.restore();
  if (state.hat === "bunny") drawBunny(f);
  if (state.hat === "unicorn" && Math.random() < 0.25 * state.dt) {
    const fr = faceFrame(f), fo = fr.toLocal(f.fore), tip = fr.toScreen(fo.x, fo.y - 0.6 * f.faceW);
    spawnSpark(tip.x, tip.y, f.unit, (Math.random() - 0.5) * 0.03 * f.unit, 0.005 * f.unit, 0.0008 * f.unit, 70);
  }
  if (now - state.lastSeen < 300) state.emit = { x: f.m.cx, y: f.m.cy, roll: f.roll, u: f.unit, open: clamp((f.mouthOpen - 0.05) / 0.4, 0, 1) };
}

// ---------- Backgrounds ----------
function blob(ctx, cx, cy, rx, ry, bump, seed) {
  ctx.beginPath();
  for (let i = 0; i <= 64; i++) {
    const a = (i / 64) * Math.PI * 2;
    const n = 1 + bump * (Math.sin(a * 3 + seed) * 0.6 + Math.sin(a * 5 + seed * 2) * 0.4);
    const x = cx + Math.cos(a) * rx * n, y = cy + Math.sin(a) * ry * n;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function stars(ctx, w, h, n) {
  ctx.fillStyle = "rgba(255,246,224,.85)";
  for (let i = 0; i < n; i++) {
    const x = (Math.sin(i * 91.7) * 0.5 + 0.5) * w, y = (Math.sin(i * 47.3 + 2) * 0.5 + 0.5) * h;
    const r = 1 + (i % 3);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
}

const BACKGROUNDS = {
  pumpkin(ctx, w, h, R) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#1D0F33"); g.addColorStop(1, "#4A2366");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); stars(ctx, w, h, 40);
    const cx = w / 2, cy = h / 2 + R * 0.08;
    ctx.fillStyle = "#3E6B2A"; ctx.save(); ctx.translate(cx, cy - R * 0.85); ctx.rotate(0.15);
    ctx.fillRect(-R * 0.07, -R * 0.28, R * 0.14, R * 0.32); ctx.restore();
    const lobes = [-0.62, -0.32, 0.32, 0.62, 0];
    for (const o of lobes) {
      const lg = ctx.createRadialGradient(cx + o * R, cy - R * 0.3, R * 0.1, cx + o * R, cy, R * 0.9);
      lg.addColorStop(0, "#FFA53A"); lg.addColorStop(1, "#D9560F");
      ctx.fillStyle = lg; ctx.beginPath();
      ctx.ellipse(cx + o * R, cy, R * (o === 0 ? 0.48 : 0.45), R * 0.86, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.strokeStyle = "rgba(140,45,0,.35)"; ctx.lineWidth = R * 0.02; ctx.stroke();
    }
  },
  potato(ctx, w, h, R) {
    ctx.fillStyle = "#9ED8C3"; ctx.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2;
    const g = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.4, R * 0.1, cx, cy, R * 1.1);
    g.addColorStop(0, "#E2B97A"); g.addColorStop(1, "#A8743B");
    ctx.fillStyle = g; blob(ctx, cx, cy, R * 0.82, R * 1.0, 0.06, 1.3); ctx.fill();
    ctx.fillStyle = "rgba(110,70,30,.45)";
    [[-0.5, -0.6], [0.55, -0.2], [-0.6, 0.35], [0.4, 0.75], [0.1, -0.85], [0.65, 0.4]].forEach(([x, y], i) => {
      ctx.beginPath(); ctx.ellipse(cx + x * R, cy + y * R, R * 0.035, R * 0.022, i, 0, Math.PI * 2); ctx.fill();
    });
  },
  moon(ctx, w, h, R) {
    ctx.fillStyle = "#0D0A24"; ctx.fillRect(0, 0, w, h); stars(ctx, w, h, 70);
    const cx = w / 2, cy = h / 2;
    const g = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.35, R * 0.1, cx, cy, R);
    g.addColorStop(0, "#F4F1E4"); g.addColorStop(1, "#A9A69B");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 0.95, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(120,116,104,.35)";
    [[-0.55, -0.55, 0.13], [0.6, -0.45, 0.09], [-0.65, 0.4, 0.1], [0.55, 0.55, 0.14], [0.05, 0.85, 0.07], [0.2, -0.78, 0.06]].forEach(([x, y, r]) => {
      ctx.beginPath(); ctx.arc(cx + x * R, cy + y * R, r * R, 0, Math.PI * 2); ctx.fill();
    });
  },
  orange(ctx, w, h, R) {
    ctx.fillStyle = "#FFE7F0"; ctx.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2 + R * 0.05;
    const g = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.35, R * 0.1, cx, cy, R);
    g.addColorStop(0, "#FFB547"); g.addColorStop(1, "#F07A12");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 0.92, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(200,90,0,.25)";
    for (let i = 0; i < 160; i++) {
      const a = i * 2.39996, r = Math.sqrt(i / 160) * R * 0.88;
      ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, R * 0.012, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#3F8F3A"; ctx.save(); ctx.translate(cx + R * 0.12, cy - R * 0.95); ctx.rotate(-0.5);
    ctx.beginPath(); ctx.ellipse(R * 0.12, 0, R * 0.2, R * 0.08, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  },
  xmas(ctx, w, h, R) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#0E1A3D"); g.addColorStop(1, "#2B3F7A");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); stars(ctx, w, h, 50);
    const cx = w / 2, cy = h / 2;
    ctx.fillStyle = "#F4F8FF"; ctx.fillRect(0, cy + 1.05 * R, w, h);
    ctx.fillStyle = "#6B3E1F"; ctx.fillRect(cx - 0.15 * R, cy + 0.82 * R, 0.3 * R, 0.3 * R);
    const tiers = [[-1.2, -0.35, 0.6], [-0.78, 0.28, 0.88], [-0.3, 0.9, 1.08]];
    for (const [t0, t1, hw] of tiers) {
      const tg = ctx.createLinearGradient(cx - hw * R, 0, cx + hw * R, 0);
      tg.addColorStop(0, "#1E7A3A"); tg.addColorStop(0.45, "#2FA651"); tg.addColorStop(1, "#16612C");
      ctx.fillStyle = tg; ctx.beginPath();
      ctx.moveTo(cx, cy + t0 * R); ctx.lineTo(cx + hw * R, cy + t1 * R);
      ctx.quadraticCurveTo(cx, cy + (t1 + 0.08) * R, cx - hw * R, cy + t1 * R); ctx.closePath(); ctx.fill();
    }
    const cols = ["#FF3B3B", "#FFD23F", "#3BA7FF", "#FF5C8A", "#FFFFFF"];
    [[-0.25, -0.62], [0.2, -0.75], [-0.6, 0.15], [0.62, 0.12], [-0.85, 0.75], [0.85, 0.72], [-0.4, 0.82], [0.4, 0.85], [0.05, -0.98], [-0.62, -0.25], [0.62, -0.28]]
      .forEach(([x, y], i) => { ctx.fillStyle = cols[i % cols.length]; ell(ctx, cx + x * R, cy + y * R, 0.06 * R, 0.06 * R); });
    ctx.fillStyle = "#FFD23F"; ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = (i % 2 ? 0.07 : 0.17) * R, a = -Math.PI / 2 + i * Math.PI / 5;
      ctx.lineTo(cx + Math.cos(a) * r, cy - 1.22 * R + Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill();
  },
  tree(ctx, w, h, R) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#7EC8FF"); g.addColorStop(1, "#D6F0FF");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2;
    ctx.fillStyle = "#FFE066"; ell(ctx, w * 0.85, h * 0.1, R * 0.18, R * 0.18);
    ctx.fillStyle = "#6CC04A"; ell(ctx, cx, h + R * 0.2, w, R * 0.8);
    ctx.fillStyle = "#7A4A24"; ctx.beginPath();
    ctx.moveTo(cx - 0.18 * R, cy + 0.6 * R); ctx.lineTo(cx + 0.18 * R, cy + 0.6 * R);
    ctx.lineTo(cx + 0.28 * R, h); ctx.lineTo(cx - 0.28 * R, h); ctx.closePath(); ctx.fill();
    const blobs = [[0, 0, 0.92], [-0.62, 0.2, 0.5], [0.62, 0.2, 0.5], [-0.45, -0.55, 0.5], [0.45, -0.55, 0.5], [0, -0.85, 0.48], [-0.75, -0.2, 0.42], [0.75, -0.2, 0.42]];
    ctx.fillStyle = "#2E8B3E"; blobs.forEach(([x, y, r]) => ell(ctx, cx + x * R, cy + y * R, r * R * 1.04, r * R * 1.04));
    ctx.fillStyle = "#3FAE4F"; blobs.forEach(([x, y, r]) => ell(ctx, cx + x * R, cy + y * R, r * R, r * R));
    ctx.fillStyle = "rgba(30,100,40,.35)";
    [[-0.7, 0.45], [0.75, 0.4], [-0.55, -0.75], [0.6, -0.8], [0, -1.15], [-0.95, -0.1], [0.95, 0.0]].forEach(([x, y]) => ell(ctx, cx + x * R, cy + y * R, 0.06 * R, 0.04 * R));
    ctx.fillStyle = "#FF3B3B";
    [[-0.75, 0.3], [0.7, -0.45], [-0.3, -0.85]].forEach(([x, y]) => ell(ctx, cx + x * R, cy + y * R, 0.05 * R, 0.05 * R));
  },
  photo(ctx, w, h) {
    const img = state.photo;
    if (!img) { ctx.fillStyle = "#3D2159"; ctx.fillRect(0, 0, w, h); return; }
    const s = Math.max(w / img.width, h / img.height);
    ctx.drawImage(img, (w - img.width * s) / 2, (h - img.height * s) / 2, img.width * s, img.height * s);
  },
};

function redrawBg() {
  const w = bgCanvas.width, h = bgCanvas.height;
  if (!w || !h) return;
  const R = Math.min(w, h) * 0.42;
  bctx.clearRect(0, 0, w, h);
  BACKGROUNDS[state.bg](bctx, w, h, R);
}

// ---------- Drawing a feature cut-out ----------
function drawFeature(box, cropW, cropH, k, roll, tx, ty, alpha) {
  const tw = Math.max(2, Math.round(cropW * k)), th = Math.max(2, Math.round(cropH * k));
  if (feat.width !== tw || feat.height !== th) { feat.width = tw; feat.height = th; }
  fctx.setTransform(1, 0, 0, 1, 0, 0);
  fctx.globalCompositeOperation = "source-over";
  fctx.clearRect(0, 0, tw, th);
  fctx.translate(tw / 2, th / 2);
  fctx.rotate(-roll);
  fctx.scale(k, k);
  fctx.drawImage(src, -box.cx, -box.cy);
  // soft oval mask
  fctx.setTransform(tw / 2, 0, 0, th / 2, tw / 2, th / 2);
  fctx.globalCompositeOperation = "destination-in";
  const g = fctx.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, "rgba(0,0,0,1)"); g.addColorStop(0.62, "rgba(0,0,0,1)"); g.addColorStop(1, "rgba(0,0,0,0)");
  fctx.fillStyle = g; fctx.fillRect(-1, -1, 2, 2);
  fctx.setTransform(1, 0, 0, 1, 0, 0);
  fctx.globalCompositeOperation = "source-over";
  octx.globalAlpha = alpha;
  octx.drawImage(feat, tx - tw / 2, ty - th / 2);
  octx.globalAlpha = 1;
}

function renderFace(W, H, now) {
  octx.drawImage(bgCanvas, 0, 0);
  const f = state.face;
  if (!f) return;
  const since = now - state.lastSeen;
  const alpha = since < 400 ? 1 : Math.max(0, 1 - (since - 400) / 400);
  if (alpha <= 0) return;
  const R = Math.min(W, H) * 0.42;
  const cx = W / 2 + state.offX, cy = H / 2 + state.offY;
  const gap = 0.64 * R * state.size;     // eye-to-eye distance on the picture
  const k = gap / Math.max(f.unit, 1);    // video px -> picture px
  const u = f.unit;
  const eyeW = u * 0.72, eyeH = u * 0.5;
  drawFeature(f.eL, eyeW, eyeH, k, f.roll, cx - gap / 2, cy - 0.12 * R * state.size, alpha);
  drawFeature(f.eR, eyeW, eyeH, k, f.roll, cx + gap / 2, cy - 0.12 * R * state.size, alpha);
  const mW = Math.max(f.m.w * 1.35, u * 0.6), mH = Math.max(f.m.h * 1.5, u * 0.42);
  drawFeature(f.m, mW, mH, k, f.roll, cx, cy + 0.42 * R * state.size, alpha);
  if (since < 300) state.emit = { x: cx, y: cy + 0.42 * R * state.size, roll: 0, u: gap, open: clamp((f.mouthOpen - 0.05) / 0.4, 0, 1) };
}

// ---------- Main loop ----------
function loop() {
  requestAnimationFrame(loop);
  if (state.processing) return; // camera paused while the video is being made
  const W = cam.videoWidth, H = cam.videoHeight;
  if (!W || !H) return;
  if (out.width !== W || out.height !== H) {
    out.width = src.width = bgCanvas.width = W;
    out.height = src.height = bgCanvas.height = H;
    redrawBg();
  }
  sctx.setTransform(-1, 0, 0, 1, W, 0);
  sctx.drawImage(cam, 0, 0, W, H);
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  const now = performance.now();
  state.dt = state.lastLoop ? clamp((now - state.lastLoop) / 16.67, 0.2, 3) : 1;
  state.lastLoop = now;
  state.emit = null;

  const look = state.look;
  const needFace = look !== "plain" || state.mouthFx !== "none";
  if (needFace && state.landmarker && cam.currentTime !== state.lastVideoTime) {
    state.lastVideoTime = cam.currentTime;
    try {
      const res = state.landmarker.detectForVideo(cam, now);
      if (res.faceLandmarks && res.faceLandmarks.length) {
        updateFace(res.faceLandmarks[0], W, H);
        state.lastSeen = now;
      }
    } catch (e) { console.warn(e); }
  }
  // 1. the look
  if (look === "face") renderFace(W, H, now);
  else if (look === "toon") renderToon(W, H, now);
  else {
    octx.drawImage(src, 0, 0);
    if (look === "mask") renderMask(now);
    else if (look === "acc") renderAccessories(now);
    else if (state.face && now - state.lastSeen < 300) {
      const f = state.face;
      state.emit = { x: f.m.cx, y: f.m.cy, roll: f.roll, u: f.unit, open: clamp((f.mouthOpen - 0.05) / 0.4, 0, 1) };
    }
  }
  // 2. extras: weather, mouth magic, colors
  if (state.env !== "none") renderEnv(now, W, H);
  runFx(now);
  if (!state.landmarker && needFace) {
    octx.fillStyle = "rgba(43,22,64,.7)";
    octx.fillRect(0, H / 2 - 40, W, 80);
    octx.fillStyle = "#FFF6E0"; octx.textAlign = "center"; octx.textBaseline = "middle";
    octx.font = `700 ${Math.round(Math.min(W, H) * 0.05)}px "Baloo 2", sans-serif`;
    octx.fillText("Getting the face finder ready…", W / 2, H / 2);

}

// Small JPEG frames saved while recording, so videos can play backward
const CAP_FPS = 15;
const cap = document.createElement("canvas"), cctx = cap.getContext("2d");
function captureFrame(now) {
  if (!state.recorder || now - state.lastFrameT < 1000 / CAP_FPS - 2) return;
  state.lastFrameT = now;
  const sw = 360, sh = Math.round(out.height * sw / out.width);
  if (cap.width !== sw || cap.height !== sh) { cap.width = sw; cap.height = sh; }
  cctx.drawImage(out, 0, 0, sw, sh);
  state.framePromises.push(new Promise((r) => cap.toBlob(r, "image/jpeg", 0.72)));

// ---------- Recording ----------
function pickMime() {
  const types = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
  return types.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
}
const MAX_SECONDS = 15;
let timerInt = null;

// Sounds made on the fly (no files needed)
function sfx(kind) {
  const ac = getActx(); if (!ac) return;
  if (ac.state === "suspended") ac.resume().catch(() => {});
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.connect(g); g.connect(ac.destination);
  if (kind === "bloop") {
    o.type = "sine";
    o.frequency.setValueAtTime(720, t); o.frequency.exponentialRampToValueAtTime(260, t + 0.18);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.6, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    o.start(t); o.stop(t + 0.26);
  } else {
    o.type = "square";
    o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1320, t + 0.08);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
    g.gain.setValueAtTime(0.25, t + 0.15); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.start(t); o.stop(t + 0.21);
  }
}

let cdTimer = null;
function showNum(v) {

  void el.offsetWidth;

function startCountdown() {

  let n = 5; showNum(n); sfx("bloop");
  cdTimer = setInterval(() => {

    clearInterval(cdTimer); cdTimer = null;

  $("recBtn").classList.remove("counting"); $("recBtn").setAttribute("aria-label", "Start recording");
}
function beepThenRecord() {

$("recBtn").onclick = () => {
  if (state.recorder) { stopRec(); return; }

  if (state.starting || state.processing) return;
  if (!state.stream || !out.width) { toast("Turn on the camera first"); return; }
  if (state.drawer) setDrawer(false);
  if (state.timer) startCountdown(); else beepThenRecord();
};

function startRec() {
  if (!state.stream || !out.width) { toast("Turn on the camera first"); return; }
  const vs = out.captureStream(30);
  state.stream.getAudioTracks().forEach((t) => vs.addTrack(t));
  const mime = pickMime();
  let rec;
  try { rec = new MediaRecorder(vs, mime ? { mimeType: mime } : undefined); }
  catch (e) { toast("Recording isn’t supported in this browser"); return; }
  state.chunks = []; state.framePromises = []; state.lastFrameT = 0;
  rec.ondataavailable = (e) => { if (e.data && e.data.size) state.chunks.push(e.data); };
  rec.onstop = saveClip;
  rec.start(250);
  state.recorder = rec; state.recStart = performance.now();
  $("recBtn").classList.add("on"); $("recBtn").setAttribute("aria-label", "Stop recording");
  // time bar fills up over 15 seconds, turns pink for the last 3
  const bar = $("recBar"), fill = $("recFill");
  bar.classList.remove("ending"); bar.hidden = false;
  fill.style.transition = "none"; fill.style.width = "0%";
  void fill.offsetWidth;
  fill.style.transition = `width ${MAX_SECONDS}s linear`; fill.style.width = "100%";
  timerInt = setInterval(() => {
    const secs = (performance.now() - state.recStart) / 1000;
    if (secs >= MAX_SECONDS - 3) bar.classList.add("ending");
    if (secs >= MAX_SECONDS) stopRec();
  }, 100);
}
function stopRec() {
  if (!state.recorder) return;
  state.recDuration = (performance.now() - state.recStart) / 1000;
  state.thumb = out.toDataURL("image/jpeg", 0.6);
  state.processing = true; state.procStart = performance.now();
  $("processing").hidden = false;
  state.recorder.stop(); state.recorder = null;
  clearInterval(timerInt);
  $("recBtn").classList.remove("on"); $("recBtn").setAttribute("aria-label", "Start recording");
  $("recBar").hidden = true;
}
function endProcessing() {
  state.processing = false;
  $("processing").hidden = true;
}
async function saveClip() {
  try {
    const type = state.chunks[0]?.type || pickMime() || "video/webm";
    const blob = new Blob(state.chunks, { type });
    const frames = (await Promise.all(state.framePromises || [])).filter(Boolean);
    const fps = clamp(frames.length / Math.max(0.5, state.recDuration || 1), 1, 30);
    const clip = { id: Date.now(), blob, thumb: state.thumb, dur: state.recDuration, type, frames, fps };
    // keep the "making your video" screen up long enough to notice
    const wait = 800 - (performance.now() - state.procStart);
    if (wait > 0) await new Promise((r) => setTimeout(r, wait));
    openPlayer(clip, true); // play it right away; asks to keep it when he leaves
    player.addEventListener("playing", endProcessing, { once: true });
    setTimeout(endProcessing, 2500); // never leave the screen stuck
  } catch (e) {
    console.error(e); endProcessing(); toast("Something went wrong, try again");
  }
}

// ---------- Storage (stays inside this app) ----------
const db = (() => {
  let mem = [], idb = null;
  const ready = new Promise((res) => {
    try {
      const req = indexedDB.open("silly-cam", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("clips", { keyPath: "id" });
      req.onsuccess = () => { idb = req.result; res(); };
      req.onerror = () => res();
    } catch (e) { res(); }
  });
  const tx = (mode) => idb.transaction("clips", mode).objectStore("clips");
  const wrap = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return {
    async all() { await ready; if (!idb) return [...mem]; try { return await wrap(tx("readonly").getAll()); } catch (e) { return [...mem]; } },
    async put(c) { await ready; if (!idb) { mem.push(c); return; } try { await wrap(tx("readwrite").put(c)); } catch (e) { mem.push(c); } },
    async del(id) { await ready; mem = mem.filter((c) => c.id !== id); if (idb) try { await wrap(tx("readwrite").delete(id)); } catch (e) {} },
  };
})();

async function refreshCount() { $("count").textContent = (await db.all()).length; }
refreshCount();

// ---------- Gallery & player ----------
let current = null, currentUrl = null, fresh = false;
const player = $("player"), fcan = $("fplayer"), fpx = fcan.getContext("2d");
const pb = { dir: "fwd", rate: 1, actx: null, src: null, start: 0, pos: 0, raf: 0, cache: new Map(), pending: new Set(), seq: null, cycle: 1, paused: false };

$("galleryBtn").onclick = openGallery;
$("galleryClose").onclick = () => { $("gallery").hidden = true; };

async function openGallery() {
  const clips = (await db.all()).sort((a, b) => b.id - a.id);
  const grid = $("grid"); grid.innerHTML = "";
  if (!clips.length) grid.innerHTML = '<div class="empty">No videos yet. Tap the yellow button to record one.</div>';
  for (const c of clips) {
    const b = document.createElement("button");
    b.className = "clip"; b.setAttribute("aria-label", "Play video");
    b.innerHTML = `<img alt="" src="${c.thumb}"><span class="len">${Math.max(1, Math.round(c.dur || 0))}s</span>`;
    b.onclick = () => openPlayer(c, false);
    grid.appendChild(b);
  }
  $("gallery").hidden = false;
}

function showPlaying(on) { $("tapPlay").textContent = "▶"; $("tapPlay").style.opacity = on ? 0 : 1; }

function openPlayer(c, isFresh) {
  current = c; fresh = isFresh;
  if (currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl = URL.createObjectURL(c.blob);
  player.src = currentUrl;
  clearCache();
  pb.rate = 1; pb.pos = 0;
  pressGroup($("speeds"), $("speeds").querySelector('[data-rate="1"]'));
  $("delBtn").hidden = isFresh;
  $("playerSheet").hidden = false;
  setDir("fwd");
}
function closePlayer() {
  stopFrames(); clearCache();
  player.pause(); player.removeAttribute("src"); player.load();
  $("playerSheet").hidden = true;
  current = null; fresh = false;
}
$("playerClose").onclick = () => { if (fresh) askFresh(); else closePlayer(); };
player.addEventListener("contextmenu", (e) => e.preventDefault());
fcan.addEventListener("contextmenu", (e) => e.preventDefault());

$("tapPlay").onclick = () => {
  if (pb.dir === "fwd") {
    if (player.paused) { player.play(); showPlaying(true); } else { player.pause(); showPlaying(false); }
  } else if (pb.paused) { pb.paused = false; startFrames(pb.pos); showPlaying(true); }
  else { stopFrames(); pb.paused = true; showPlaying(false); }
};

function applyPitch() {
  const keep = !$("sillyVoice").checked;
  player.preservesPitch = keep; player.mozPreservesPitch = keep; player.webkitPreservesPitch = keep;
}
function setRate(r) {
  pb.rate = r;
  pressGroup($("speeds"), $("speeds").querySelector(`[data-rate="${r}"]`));
  applyPitch();
  player.playbackRate = r; player.defaultPlaybackRate = r;
  if (pb.dir !== "fwd" && !pb.paused) startFrames(pb.pos);
}
$("speeds").onclick = (e) => { const b = e.target.closest("[data-rate]"); if (b) setRate(parseFloat(b.dataset.rate)); };
$("sillyVoice").onchange = () => { const r = player.playbackRate; applyPitch(); player.playbackRate = r; };

function setDir(d) {
  pb.dir = d;
  pressGroup($("dirs"), $("dirs").querySelector(`[data-dir="${d}"]`));
  stopFrames(); pb.paused = false; pb.pos = 0; showPlaying(true);
  if (d === "fwd") {
    fcan.hidden = true; player.hidden = false;
    applyPitch(); player.playbackRate = pb.rate; player.defaultPlaybackRate = pb.rate;
    player.currentTime = 0;
    player.play().catch(() => showPlaying(false));
  } else {
    player.pause(); player.hidden = true; fcan.hidden = false;
    startFrames(0);
  }
}
$("dirs").onclick = (e) => { const b = e.target.closest("[data-dir]"); if (b) setDir(b.dataset.dir); };

// Backward / boomerang player: draws saved frames and plays flipped audio
function getActx() {
  if (!pb.actx) { try { pb.actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  return pb.actx;
}
async function decodeAudio(c) {
  if (c._audio !== undefined) return c._audio;
  c._audio = null;
  const ac = getActx(); if (!ac) return null;
  try {
    const ab = await c.blob.arrayBuffer();
    c._audio = await new Promise((res, rej) => { const p = ac.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); });
  } catch (e) { c._audio = null; }
  return c._audio;
}
function flipAudio(ac, buf, dir) {
  const n = buf.length, len = dir === "boom" ? n * 2 : n;
  const o = ac.createBuffer(buf.numberOfChannels, len, buf.sampleRate);
  for (let ch = 0; ch < buf.numberOfChannels; ch++) {
    const sd = buf.getChannelData(ch), d = o.getChannelData(ch);
    if (dir === "rev") { for (let i = 0; i < n; i++) d[i] = sd[n - 1 - i]; }
    else { d.set(sd, 0); for (let i = 0; i < n; i++) d[n + i] = sd[n - 1 - i]; }
  }
  return o;
}
function stopFrames() {
  cancelAnimationFrame(pb.raf); pb.raf = 0;
  if (pb.src) { try { pb.src.stop(); } catch (e) {} pb.src = null; }
}
function clearCache() {
  for (const bm of pb.cache.values()) bm.close?.();
  pb.cache.clear(); pb.pending.clear();
}
async function startFrames(fromPos) {
  stopFrames();
  const c = current, dir = pb.dir;
  const n = c?.frames?.length || 0;
  if (n < 2) { toast("Only new videos can play backward"); setDir("fwd"); return; }
  const idx = [...Array(n).keys()];
  pb.seq = dir === "rev" ? idx.slice().reverse() : idx.concat(idx.slice().reverse().slice(1, -1));
  pb.cycle = pb.seq.length / c.fps;
  const pos = (fromPos || 0) % pb.cycle;
  const ac = getActx();
  if (ac && ac.state === "suspended") { try { await ac.resume(); } catch (e) {} }
  const buf = await decodeAudio(c);
  if (current !== c || pb.dir !== dir || pb.paused) return;
  stopFrames();
  if (ac && buf) {
    const key = "_" + dir;
    if (!c[key]) c[key] = flipAudio(ac, buf, dir);
    const srcNode = ac.createBufferSource();
    srcNode.buffer = c[key]; srcNode.loop = true; srcNode.playbackRate.value = pb.rate;
    srcNode.connect(ac.destination);
    srcNode.start(0, (pos / pb.cycle) * c[key].duration);
    pb.src = srcNode;
  }
  pb.start = performance.now() / 1000 - pos / pb.rate;
  pb.raf = requestAnimationFrame(tickFrames);
}
function tickFrames() {
  pb.raf = requestAnimationFrame(tickFrames);
  const c = current; if (!c) return;
  const pos = ((performance.now() / 1000 - pb.start) * pb.rate) % pb.cycle;
  pb.pos = pos;
  const k = Math.min(pb.seq.length - 1, Math.floor(pos * c.fps));
  for (let j = 0; j < 8; j++) wantFrame(c, pb.seq[(k + j) % pb.seq.length]);
  const bm = pb.cache.get(pb.seq[k]);
  if (bm) {
    if (fcan.width !== bm.width || fcan.height !== bm.height) { fcan.width = bm.width; fcan.height = bm.height; }
    fpx.drawImage(bm, 0, 0);
  }
}
function wantFrame(c, i) {
  if (pb.cache.has(i) || pb.pending.has(i)) return;
  pb.pending.add(i);
  const done = (bm) => {
    pb.pending.delete(i);
    if (current !== c) { bm?.close?.(); return; }
    if (!bm) return;
    pb.cache.set(i, bm);
    while (pb.cache.size > 40) { const [k0, v] = pb.cache.entries().next().value; v.close?.(); pb.cache.delete(k0); }
  };
  if (window.createImageBitmap) createImageBitmap(c.frames[i]).then(done, () => done(null));
  else { const img = new Image(); img.onload = () => done(img); img.onerror = () => done(null); img.src = URL.createObjectURL(c.frames[i]); }
}

// ---------- Keep or delete dialogs ----------
function makeBtn(cls, html, onClick) {
  const b = document.createElement("button");
  b.className = "dbtn " + cls; b.innerHTML = html; b.onclick = onClick;
  return b;
}
function showDialog(icon, text, buttons) {
  $("dIcon").textContent = icon; $("dText").textContent = text;
  const box = $("dBtns"); box.innerHTML = "";
  buttons.forEach((b) => box.appendChild(b));
  $("dialog").hidden = false;
}
function hideDialog() { $("dialog").hidden = true; }
function storable(c) { return { id: c.id, blob: c.blob, thumb: c.thumb, dur: c.dur, type: c.type, frames: c.frames, fps: c.fps }; }

// New video: "Yes" deletes right away; "Save" only works after a 2 second wait
function askFresh() {
  const clip = current;
  const yes = makeBtn("yes", "🗑️ Yes", () => { hideDialog(); closePlayer(); });
  const save = makeBtn("save", '<span class="fill"></span><span class="lbl">💾 Save</span>', async () => {
    if (!save.classList.contains("ready")) return;
    hideDialog();
    try { await db.put(storable(clip)); toast("Saved to My videos"); }
    catch (e) { toast("Couldn’t save this video"); }
    closePlayer(); refreshCount();
  });
  save.setAttribute("aria-disabled", "true");
  showDialog("🗑️", "Delete this video?", [yes, save]);
  requestAnimationFrame(() => requestAnimationFrame(() => save.classList.add("filling")));
  setTimeout(() => { save.classList.add("ready"); save.removeAttribute("aria-disabled"); }, 3000);
}

$("delBtn").onclick = () => {
  if (!current) return;
  const c = current;
  showDialog("🗑️", "Delete this video?", [
    makeBtn("yes", "🗑️ Delete", async () => { hideDialog(); await db.del(c.id); closePlayer(); await refreshCount(); openGallery(); }),
    makeBtn("keep", "↩️ Keep", hideDialog),
  ]);
};

// ---------- Offline mode ----------
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

// ---------- Toast ----------
let toastT = null;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200);
}
</script>
